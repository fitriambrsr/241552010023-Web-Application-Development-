<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mini Task Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head> 
<body class="dashboard-body">

    <header class="main-navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-rectangle-list"></i>
            <span>Mini Task Dashboard</span>
        </div>
        <div class="user-profile">
            <div class="user-info">
                <span>Selamat datang, <strong id="usernameDisplay">User</strong></span>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <i class="fa-solid fa-power-off"></i> Keluar
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="content-container">
            
            <section class="task-form-section">
                <h3><i class="fa-solid fa-plus" style="color: #319795;"></i> Tambah Tugas Baru</h3>
                <form id="taskForm">
                    <div class="form-grid">
                        <div class="form-control">
                            <label for="taskTitle">Judul Tugas</label>
                            <input type="text" id="taskTitle" required placeholder="Contoh: Revisi Bab 1">
                        </div>
                        <div class="form-control">
                            <label for="taskDate">Tanggal Dibuat</label>
                            <input type="date" id="taskDate" required>
                        </div>
                        <div class="form-control">
                            <label for="taskGiver">Pemberi Tugas</label>
                            <input type="text" id="taskGiver" required placeholder="Nama dosen / atasan">
                        </div>
                        <div class="form-control">
                            <label for="taskDeadline">Tanggal Deadline</label>
                            <input type="date" id="taskDeadline" required>
                        </div>
                    </div>
                    <div class="form-control full-width" style="margin-top: 15px;">
                        <label for="taskDesc">Deskripsi Tugas</label>
                        <textarea id="taskDesc" rows="3" required placeholder="Tulis rincian atau detail tugas di sini..."></textarea>
                    </div>
                    <div style="text-align: right; margin-top: 15px;">
                        <button type="submit" class="btn-add-task">
                            <i class="fa-solid fa-square-plus"></i> Tambah Tugas
                        </button>
                    </div>
                </form>
            </section>

            <section class="task-list-section">
                
                <div class="task-list-header">
                    <div class="section-title">
                        <h3><i class="fa-solid fa-clipboard-list" style="color: #4a5568;"></i> Daftar Tugas Aktif</h3>
                        <p class="task-instruction">Centang kotak jika tugas telah selesai atau gunakan tombol aksi untuk mengelola data.</p>
                    </div>
                    
                    <div class="tab-navigation">
                        <button class="tab-btn active" data-filter="all">Semua Tugas</button>
                        <button class="tab-btn" data-filter="pending">Belum Selesai</button>
                        <button class="tab-btn" data-filter="completed">Selesai</button>
                    </div>
                </div>
                
                <ul id="taskList" class="task-list">
                    </ul>

                <div id="noTaskMsg" class="empty-msg">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Tidak ada tugas dalam kategori ini.</p>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
